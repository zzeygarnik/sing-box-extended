name: ZGRNK Linux

on:
  workflow_dispatch:

jobs:
  build:
    name: linux-arm64-musl
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 1
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.7
          cache: false
      - name: Clone cronet-go
        run: |
          set -xeuo pipefail
          CRONET_GO_VERSION=$(cat .github/CRONET_GO_VERSION)
          git init ~/cronet-go
          git -C ~/cronet-go remote add origin https://github.com/sagernet/cronet-go.git
          git -C ~/cronet-go sparse-checkout set --no-cone '/*' '!/lib'
          git -C ~/cronet-go fetch --depth=1 --filter=blob:none origin "$CRONET_GO_VERSION"
          git -C ~/cronet-go checkout FETCH_HEAD
          git -C ~/cronet-go submodule update --init --recursive --depth=1
      - name: Regenerate Debian keyring
        run: |
          set -xeuo pipefail
          rm -f ~/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
          cd ~/cronet-go
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh
      - name: Download Chromium toolchain
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          go run ./cmd/build-naive --target=linux/arm64 --libc=musl download-toolchain
      - name: Set Chromium toolchain environment
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          go run ./cmd/build-naive --target=linux/arm64 --libc=musl env >> $GITHUB_ENV
      - name: Build (musl)
        run: |
          set -xeuo pipefail
          mkdir -p dist
          TAGS="$(cat release/DEFAULT_BUILD_TAGS),with_musl"
          VERSION="1.14.0-extended-zgrnk-$(git rev-parse --short HEAD)"
          go build -v -trimpath -o dist/sing-box -tags "${TAGS}" \
          -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' $(cat release/LDFLAGS) -s -w -buildid=" \
          ./cmd/sing-box
          ls -la dist
          file dist/sing-box
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: arm64
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-linux-arm64-musl
          path: dist/sing-box
