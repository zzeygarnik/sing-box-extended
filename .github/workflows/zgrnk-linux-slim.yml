name: ZGRNK Linux Slim

on:
  workflow_dispatch:

jobs:
  build:
    name: linux-arm64-${{ matrix.variant }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: minimal
            tags: with_gvisor,with_wireguard,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0
          - variant: nonaive
            tags: ""
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 1
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.7
          cache: false
      - name: Build
        run: |
          set -xeuo pipefail
          mkdir -p dist
          TAGS="${{ matrix.tags }}"
          if [ -z "$TAGS" ]; then
            TAGS="$(cat release/DEFAULT_BUILD_TAGS | tr ',' '\n' | grep -v '^with_naive_outbound$' | paste -sd,)"
          fi
          VERSION="1.14.0-extended-zgrnk-$(git rev-parse --short HEAD)-${{ matrix.variant }}"
          go build -v -trimpath -o dist/sing-box -tags "${TAGS}" \
          -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' $(cat release/LDFLAGS) -s -w -buildid=" \
          ./cmd/sing-box
          ls -la dist
          file dist/sing-box
          gzip -9 -k dist/sing-box
          ls -la dist
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-linux-arm64-${{ matrix.variant }}
          path: dist/sing-box
